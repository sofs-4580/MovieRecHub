spring.application.name=user-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/movie_rec_hub_users}
spring.datasource.username=${DB_USERNAME:user_service}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# RSA PEM keys are provided outside the packaged application.
auth.jwt.private-key-location=${AUTH_JWT_PRIVATE_KEY_LOCATION}
auth.jwt.public-key-location=${AUTH_JWT_PUBLIC_KEY_LOCATION}
auth.jwt.issuer=${AUTH_JWT_ISSUER:http://user-service}
auth.jwt.access-token-ttl-seconds=${AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS:3600}

spring.application.name=user-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/movie_rec_hub_users}
spring.datasource.username=${DB_USERNAME:user_service}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# records resquest HTTP times as a histogram (time intervals), that so prometheus/grafana can compute percentiles
management.metrics.distribution.percentiles-histogram.http.server.requests=true


# Sessions are local to this application instance and identified only by a cookie.
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Durable, asynchronous creation of profiles after account registration.
profile.service.base-url=${PROFILE_SERVICE_URL:http://localhost:8082}
profile.service.connect-timeout=${PROFILE_CONNECT_TIMEOUT:2s}
profile.service.read-timeout=${PROFILE_READ_TIMEOUT:3s}
profile.provisioning.enabled=${PROFILE_PROVISIONING_ENABLED:true}
profile.provisioning.poll-delay=${PROFILE_POLL_DELAY:5000}
profile.provisioning.retry-delay=${PROFILE_RETRY_DELAY:30s}
profile.provisioning.batch-size=${PROFILE_BATCH_SIZE:10}

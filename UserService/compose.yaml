services:
  users-db:
    image: postgres:16
    environment:
      POSTGRES_DB: movie_rec_hub_users
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD before starting the database}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d movie_rec_hub_users"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  users-db-data:

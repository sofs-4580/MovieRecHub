server.port=8080

# Endereco do MovieService. No docker-compose vem da variavel MOVIE_SERVICE_URL;
# a correr fora do Docker usa o localhost.
movie.service.url=${MOVIE_SERVICE_URL:http://localhost:8082}

logging.level.org.springframework=INFO
logging.level.root=ERROR
logging.pattern.console=%-5level %logger{36} - %msg%n

# Ainda nao ha login: o front end age sempre como este utilizador.
# TODO: remover quando o utilizador vier do token de autenticacao.
app.current-user-id=${CURRENT_USER_ID:1}

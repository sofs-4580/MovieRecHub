spring.application.name=frontend
server.port=${SERVER_PORT:8080}

# Backend services. In docker-compose these come from the *_SERVICE_URL variables;
# outside Docker they fall back to localhost (default port of each service).
user.service.url=${USER_SERVICE_URL:http://localhost:8081}
profile.service.url=${PROFILE_SERVICE_URL:http://localhost:8082}
movie.service.url=${MOVIE_SERVICE_URL:http://localhost:8083}
recommendation.service.url=${RECOMMENDATION_SERVICE_URL:http://localhost:8084}

# IMPORTANT: the browser's "JSESSIONID" cookie is the *login* session created by UserService.
# This app still needs an HTTP session of its own (flash messages after redirects); if it used
# the default cookie name it would overwrite the login cookie and log people out.
server.servlet.session.cookie.name=FRONTEND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%-5level %logger{36} - %msg%n

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Change password — Movie Recommendation Hub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="layout">

    <aside th:replace="~{fragments/layout :: sidebar('account')}"></aside>

    <main class="main">
        <a th:href="@{/account}" class="back">&larr; Back to account</a>
        <h1 class="page-title">Change password</h1>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/account/password}" method="post" class="panel stack narrow">
            <label class="field">
                <span>Current password</span>
                <input type="password" name="currentPassword" class="input" maxlength="128"
                       autocomplete="current-password" required autofocus/>
            </label>
            <label class="field">
                <span>New password</span>
                <input type="password" name="newPassword" class="input" minlength="12" maxlength="128"
                       autocomplete="new-password" required/>
                <small class="muted">12 to 128 characters</small>
            </label>
            <label class="field">
                <span>Confirm new password</span>
                <input type="password" name="confirmPassword" class="input" minlength="12" maxlength="128"
                       autocomplete="new-password" required/>
            </label>
            <button type="submit" class="btn">Save new password</button>
        </form>
    </main>

</div>
</body>
</html>

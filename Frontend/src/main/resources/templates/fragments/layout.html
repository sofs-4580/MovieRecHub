<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Barra lateral, igual em todas as paginas. "active": 'movies', 'lists', 'profiles', 'profile' ou 'account'. -->
<aside class="sidebar" th:fragment="sidebar(active)">
    <a class="brand" th:href="@{/movies}">
        <span class="brand-mark">🎬</span>
        <span>Movie Recommendation Hub</span>
    </a>
    <nav class="nav">
        <a th:href="@{/movies}" th:classappend="${active == 'movies'} ? 'active'">Movies</a>
        <a th:href="@{/lists}" th:classappend="${active == 'lists'} ? 'active'">Lists</a>
        <a th:if="${userId != null}" th:href="@{/profiles}" th:classappend="${active == 'profiles'} ? 'active'">People</a>
        <a th:if="${userId != null}" th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'active'">My profile</a>
        <a th:if="${userId != null}" th:href="@{/account}" th:classappend="${active == 'account'} ? 'active'">Account</a>
    </nav>

    <div class="sidebar-foot">
        <p class="sidebar-user" th:if="${userServiceUnavailable}">Account service unavailable</p>
        <div class="sidebar-user" th:if="${userId != null}">
            Signed in as <strong th:text="${currentUsername}">user</strong>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit" class="btn btn-ghost btn-sm">Sign out</button>
            </form>
        </div>
        <div class="sidebar-user" th:if="${userId == null and !userServiceUnavailable}">
            <a class="btn btn-sm" th:href="@{/login}">Sign in</a>
            <a class="btn btn-ghost btn-sm" th:href="@{/register}">Create account</a>
        </div>
    </div>
</aside>

<!-- Mensagens de sucesso / erro -->
<div th:fragment="alerts">
    <div th:if="${message}" class="alert alert-ok" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
</div>

<!-- Selecao de generos (checkboxes em forma de "pills"). selected: colecao de MovieGenre ja escolhidos. -->
<div class="chip-row" th:fragment="genreChips(name, selected)">
    <label class="chip" th:each="g : ${genres}">
        <input type="checkbox" th:name="${name}" th:value="${g}" th:checked="${selected != null and selected.contains(g)}"/>
        <span th:text="${#strings.replace(#strings.toLowerCase(g), '_', '-')}">drama</span>
    </label>
</div>

</body>
</html>

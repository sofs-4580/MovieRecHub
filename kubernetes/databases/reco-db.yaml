apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reco-db-data
  namespace: movie-rec-hub
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: movie-rec-local
  volumeName: reco-db-data
  resources:
    requests:
      storage: 4Gi
---
# Stable internal address used by the application.
apiVersion: v1
kind: Service
metadata:
  name: reco-db
  namespace: movie-rec-hub
spec:
  type: ClusterIP
  selector:
    app: reco-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Governing Service for the StatefulSet's Pod identity.
apiVersion: v1
kind: Service
metadata:
  name: reco-db-headless
  namespace: movie-rec-hub
spec:
  clusterIP: None
  selector:
    app: reco-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reco-db
  namespace: movie-rec-hub
spec:
  serviceName: reco-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: reco-db
  template:
    metadata:
      labels:
        app: reco-db
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16.15-bookworm
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: movie_rec_hub_recommendations
            - name: POSTGRES_USER
              value: reco_service
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: reco-db-data

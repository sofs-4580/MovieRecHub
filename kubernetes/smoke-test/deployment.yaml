apiVersion: v1
kind: Namespace
metadata:
  name: nginx-smoke-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx-smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-smoke-test
  template:
    metadata:
      labels:
        app: nginx-smoke-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx-smoke-test
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: nginx-smoke-test
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30510

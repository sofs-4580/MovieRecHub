spring.application.name=recommendation-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/movie_rec_hub_recommendations}
spring.datasource.username=${DB_USERNAME:reco_service}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}

# Schema is managed by Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%-5level %logger{36} - %msg%n
logging.level.psia.movieRecHub.service=${RECO_LOG_LEVEL:INFO}

# --- MovieService (catalogue, lists, reviews) ---
movie.service.url=${MOVIE_SERVICE_URL:http://localhost:8083}
movie.service.connect-timeout-ms=${MOVIE_CONNECT_TIMEOUT_MS:2000}
movie.service.read-timeout-ms=${MOVIE_READ_TIMEOUT_MS:5000}

# --- LLM backend (Ollama /api/chat, published model from Hugging Face) ---
llm.url=${OLLAMA_URL:http://localhost:11434}
llm.model=${LLM_MODEL:hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M}
llm.connect-timeout-ms=${LLM_CONNECT_TIMEOUT_MS:2000}
# The first call also loads the model into memory, so allow a long read timeout.
llm.read-timeout-ms=${LLM_READ_TIMEOUT_MS:180000}
llm.num-predict=${LLM_NUM_PREDICT:200}
llm.num-ctx=${LLM_NUM_CTX:4096}
llm.keep-alive=${LLM_KEEP_ALIVE:30m}

# --- Catalogue refresh: movies are read from MovieService into memory ---
catalogue.refresh.initial-delay-ms=${CATALOGUE_REFRESH_INITIAL_DELAY_MS:5000}
catalogue.refresh.interval-ms=${CATALOGUE_REFRESH_INTERVAL_MS:60000}

recommendation.agent.initial-delay-ms=${AGENT_INITIAL_DELAY_MS:30000}
recommendation.agent.interval-ms=${AGENT_INTERVAL_MS:300000}
recommendation.agent.max-per-run=${AGENT_MAX_PER_RUN:3}

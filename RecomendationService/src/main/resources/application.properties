spring.application.name=recommendation-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/movie_rec_hub_recommendations}
spring.datasource.username=${DB_USERNAME:reco_service}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}

# Schema is managed by Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%-5level %logger{36} - %msg%n

# --- MovieService (catalogue, lists, reviews) ---
movie.service.url=${MOVIE_SERVICE_URL:http://localhost:8083}
movie.service.connect-timeout-ms=${MOVIE_CONNECT_TIMEOUT_MS:2000}
movie.service.read-timeout-ms=${MOVIE_READ_TIMEOUT_MS:5000}

# --- Embedding backend (Ollama /api/embed). Set EMBEDDING_ENABLED=false to run without any model. ---
embedding.enabled=${EMBEDDING_ENABLED:true}
embedding.url=${OLLAMA_URL:http://localhost:11434}
embedding.model=${EMBEDDING_MODEL:all-minilm}
# Some models need prefixes (e.g. nomic-embed-text: "search_document: " / "search_query: ").
embedding.document-prefix=${EMBEDDING_DOCUMENT_PREFIX:}
embedding.query-prefix=${EMBEDDING_QUERY_PREFIX:}
embedding.batch-size=${EMBEDDING_BATCH_SIZE:16}
embedding.connect-timeout-ms=${EMBEDDING_CONNECT_TIMEOUT_MS:2000}
embedding.batch-read-timeout-ms=${EMBEDDING_BATCH_READ_TIMEOUT_MS:120000}
embedding.query-read-timeout-ms=${EMBEDDING_QUERY_READ_TIMEOUT_MS:8000}

# --- Catalogue refresh: movies are read from MovieService into memory; only embeddings are stored ---
catalogue.refresh.initial-delay-ms=${CATALOGUE_REFRESH_INITIAL_DELAY_MS:5000}
catalogue.refresh.interval-ms=${CATALOGUE_REFRESH_INTERVAL_MS:60000}

# --- Recommendations ---
recommendation.default-limit=${RECOMMENDATION_LIMIT:10}
recommendation.weight.request=${WEIGHT_REQUEST:0.45}
recommendation.weight.taste=${WEIGHT_TASTE:0.30}
recommendation.weight.profile=${WEIGHT_PROFILE:0.15}
recommendation.weight.rating=${WEIGHT_RATING:0.10}

# --- Background agent (pre-computes and caches recommendations) ---
recommendation.agent.enabled=${AGENT_ENABLED:true}
recommendation.agent.initial-delay-ms=${AGENT_INITIAL_DELAY_MS:30000}
recommendation.agent.interval-ms=${AGENT_INTERVAL_MS:60000}
recommendation.agent.batch-size=${AGENT_BATCH_SIZE:20}
recommendation.agent.ttl-minutes=${AGENT_TTL_MINUTES:60}

services:
  reco-db:
    image: postgres:16
    environment:
      POSTGRES_DB: movie_rec_hub_recommendations
      POSTGRES_USER: reco_service
      # Local development: connections do not require a password.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${RECO_DB_PORT:-5436}:5432"
    volumes:
      - reco-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reco_service -d movie_rec_hub_recommendations"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: reco-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  reco-db-data:
  ollama-data:

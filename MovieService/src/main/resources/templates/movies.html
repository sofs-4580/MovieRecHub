<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Movies — Movie Recommendation Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/movies">🎬 Movie Recommendation Hub</a>
        <a class="btn btn-outline-primary" href="/recommendations">Ask for recommendations</a>
    </div>
</nav>

<div class="container mt-4">

    <h2>Movies</h2>
    <hr>

    <form method="get" th:action="@{/movies}" class="mb-4 d-flex gap-2">
        <select name="genre" class="form-select w-auto">
            <option value="">All genres</option>
            <option th:each="g : ${genres}" th:value="${g}" th:text="${g}"
                    th:selected="${g == genre}"></option>
        </select>
        <button type="submit" class="btn btn-primary">Filter</button>
    </form>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${movies != null and not #lists.isEmpty(movies)}">
        <div class="col" th:each="m : ${movies}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${m.title()}">Title</h5>
                    <p class="card-text text-muted small mb-1" th:text="${m.releaseYear()}">Year</p>
                    <p class="card-text small" th:text="${#strings.listJoin(m.genres(), ', ')}">Genres</p>
                    <p class="card-text">
                        ⭐ <span th:text="${m.avgRating() > 0} ? ${#numbers.formatDecimal(m.avgRating(), 1, 1)} : 'No reviews'"></span>
                    </p>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/movies/{id}(id=${m.id()})}" class="btn btn-outline-primary btn-sm w-100">View details</a>
                </div>
            </div>
        </div>
    </div>

    <p th:if="${movies != null and #lists.isEmpty(movies)}" class="text-muted">No movies found.</p>

</div>
</body>
</html>

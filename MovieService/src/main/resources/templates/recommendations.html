<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Recommendations — Movie Recommendation Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/movies">Movie Recommendation Hub</a>
        <a class="btn btn-outline-primary" href="/movies">Browse movies</a>
    </div>
</nav>
<main class="container" style="max-width: 760px">
    <h1 class="h3 mb-4">Ask for movie recommendations</h1>
    <form method="post" th:action="@{/recommendations}" class="vstack gap-3">
        <div>
            <label for="userId" class="form-label">User ID</label>
            <input id="userId" name="userId" type="number" min="1" class="form-control"
                   th:value="${userId}" required>
        </div>
        <div>
            <label for="prompt" class="form-label">What would you like to watch?</label>
            <textarea id="prompt" name="prompt" class="form-control" rows="4" maxlength="1000"
                      placeholder="For example: Recommend a tense science-fiction film, preferably from the 1980s."
                      th:text="${prompt}" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary align-self-start">Get recommendations</button>
    </form>
    <div th:if="${error}" class="alert alert-danger mt-4" th:text="${error}"></div>
    <section th:if="${recommendations}" class="mt-4">
        <h2 class="h5">Recommendations</h2>
        <pre class="border rounded p-3 bg-light text-wrap" th:text="${recommendations}"></pre>
    </section>
</main>
</body>
</html>

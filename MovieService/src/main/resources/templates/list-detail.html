<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${list.name()}">List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/movies">🎬 Movie Recommendation Hub</a>
        <a class="nav-link" href="/lists">Lists</a>
    </div>
</nav>

<div class="container mt-4">

    <a th:href="@{/lists(userId=${userId})}" class="btn btn-link px-0">&larr; Back to lists</a>

    <h2 th:text="${list.name()}">Name</h2>
    <p class="text-muted" th:text="${list.description()}"></p>
    <p>
        <span class="badge text-bg-secondary" th:text="${list.type()}"></span>
        <span class="badge text-bg-light" th:text="${list.visibility()}"></span>
        <span class="text-muted small" th:text="'by user ' + ${list.ownerId()}"></span>
    </p>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <ol class="list-group list-group-numbered mb-4" th:if="${not #lists.isEmpty(list.items())}">
        <li class="list-group-item d-flex justify-content-between align-items-start" th:each="i : ${list.items()}">
            <div class="ms-2 me-auto">
                <a th:href="@{/movies/{id}(id=${i.movie().id()}, userId=${userId})}"
                   class="fw-bold" th:text="${i.movie().title()}">Title</a>
                <div class="small text-muted"
                     th:text="${i.movie().releaseYear()} + ' · ' + ${#strings.listJoin(i.movie().genres(), ', ')}"></div>
            </div>
            <form th:if="${isOwner}" th:action="@{/lists/{id}/remove(id=${list.id()})}" method="post">
                <input type="hidden" name="userId" th:value="${userId}"/>
                <input type="hidden" name="movieId" th:value="${i.movie().id()}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm">Remove</button>
            </form>
        </li>
    </ol>
    <p th:if="${#lists.isEmpty(list.items())}" class="text-muted">This list is empty.</p>

    <form th:if="${isOwner and list.type().name() == 'CUSTOM'}"
          th:action="@{/lists/{id}/delete(id=${list.id()})}" method="post">
        <input type="hidden" name="userId" th:value="${userId}"/>
        <button type="submit" class="btn btn-danger btn-sm">Delete list</button>
    </form>

</div>
</body>
</html>

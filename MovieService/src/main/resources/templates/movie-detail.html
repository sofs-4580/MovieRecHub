<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${movie != null ? movie.title() : 'Movie'}">Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/movies">🎬 Movie Recommendation Hub</a>
        <a class="nav-link" href="/lists">Lists</a>
    </div>
</nav>

<div class="container mt-4" th:if="${movie != null}">

    <a href="/movies" class="btn btn-link px-0">&larr; Back to movies</a>

    <h2 th:text="${movie.title()}">Title</h2>
    <p class="text-muted" th:text="${movie.releaseYear()} + ' · ' + ${#strings.listJoin(movie.genres(), ', ')}"></p>
    <p th:text="${movie.synopsis()}">Synopsis</p>
    <p><strong>Director:</strong> <span th:text="${movie.director()}"></span></p>
    <p><strong>Cast:</strong> <span th:text="${movie.actors()}"></span></p>
    <p>⭐ <span th:text="${movie.avgRating() > 0} ? ${#numbers.formatDecimal(movie.avgRating(), 1, 1)} : 'No reviews yet'"></span></p>

    <div class="d-flex align-items-center gap-2 mb-3">
        <form th:if="${userId != null}" th:action="@{/movies/{id}/like(id=${movie.id()})}" method="post">
            <input type="hidden" name="userId" th:value="${userId}"/>
            <button type="submit" class="btn btn-sm"
                    th:classappend="${liked} ? 'btn-primary' : 'btn-outline-primary'"
                    th:text="${liked} ? '👍 Liked' : '👍 Like'">Like</button>
        </form>
        <span class="text-muted" th:text="${likeCount} + ' likes'">0 likes</span>
        <span class="text-muted small" th:if="${userId == null}">(enter your user id below to like)</span>
    </div>

    <hr>
    <h4>Add to a list</h4>
    <!-- TODO: remover o pedido de userId quando houver sessao -->
    <form method="get" th:action="@{/movies/{id}(id=${movie.id()})}" class="d-flex gap-2 mb-2">
        <input type="number" name="userId" class="form-control w-auto" placeholder="Your user id"
               th:value="${userId}" required/>
        <button type="submit" class="btn btn-outline-secondary">Load my lists</button>
    </form>
    <form th:if="${lists != null}" method="post" class="d-flex gap-2"
          th:action="@{/lists/add}">
        <input type="hidden" name="userId" th:value="${userId}"/>
        <input type="hidden" name="movieId" th:value="${movie.id()}"/>
        <select name="listId" class="form-select w-auto">
            <option th:each="l : ${lists}" th:value="${l.id()}" th:text="${l.name()}"></option>
        </select>
        <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <hr>
    <h4>Reviews</h4>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${reviews != null and not #lists.isEmpty(reviews)}">
        <div class="border-bottom py-2" th:each="r : ${reviews}">
            <strong th:text="'⭐ ' + ${r.rating()}"></strong>
            <span th:text="${r.comment()}"></span>
            <div class="text-muted small" th:text="${r.createdAt()}"></div>
        </div>
    </div>
    <p th:if="${reviews != null and #lists.isEmpty(reviews)}" class="text-muted">No reviews yet — be the first!</p>

    <h5 class="mt-4">Add a review</h5>
    <form th:action="@{/movies/{id}/review(id=${movie.id()})}" method="post" class="row g-2">
        <!-- TODO: substituir por userId da sessão quando a integração com o UserService existir -->
        <div class="col-auto">
            <input type="number" name="userId" class="form-control" placeholder="Your user id" required/>
        </div>
        <div class="col-auto">
            <input type="number" name="rating" min="1" max="5" class="form-control" placeholder="Rating (1-5)" required/>
        </div>
        <div class="col-auto">
            <input type="text" name="comment" class="form-control" placeholder="Comment"/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Submit review</button>
        </div>
    </form>

</div>
</body>
</html>

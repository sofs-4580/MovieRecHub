spring.application.name=movie-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/movie_rec_hub_movies}
spring.datasource.username=${DB_USERNAME:movie_service}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Schema is managed by Hibernate here (no Flyway yet). For production: Flyway + "validate".
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# records resquest HTTP times as a histogram (time intervals), that so prometheus/grafana can compute percentiles
management.metrics.distribution.percentiles-histogram.http.server.requests=true


logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%-5level %logger{36} - %msg%n

# TMDB API key used by BdLoader to seed the catalogue (empty default: app boots, seed is skipped/fails gracefully)
tmdb.api.key=${TMDB_API_KEY:}

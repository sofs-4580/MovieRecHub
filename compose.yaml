services:
  users-db:
    extends:
      file: ./UserService/compose.yaml
      service: users-db
    restart: unless-stopped

  profiles-db:
    extends:
      file: ./ProfileService/compose.yaml
      service: profiles-db
    restart: unless-stopped

  user-service:
    build:
      context: ./UserService
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://users-db:5432/movie_rec_hub_users
      DB_USERNAME: user_service
      DB_PASSWORD: ""
      PROFILE_SERVICE_URL: http://profile-service:8082
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      users-db:
        condition: service_healthy
    restart: unless-stopped

  profile-service:
    build:
      context: ./ProfileService
    environment:
      SERVER_PORT: "8082"
      PROFILE_DB_URL: jdbc:postgresql://profiles-db:5432/movie_rec_hub_profiles
      PROFILE_DB_USERNAME: profile_service
      PROFILE_DB_PASSWORD: ""
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "127.0.0.1:${PROFILE_SERVICE_PORT:-8082}:8082"
    depends_on:
      profiles-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "3000"
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      user-service:
        condition: service_healthy
    restart: unless-stopped

# Volumes referenced by the extended database services must also be declared here.
volumes:
  users-db-data:
  profiles-db-data:

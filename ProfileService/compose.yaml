services:
  profiles-db:
    image: postgres:16
    environment:
      POSTGRES_DB: movie_rec_hub_profiles
      POSTGRES_USER: profile_service
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:?Define PROFILE_DB_PASSWORD before starting the database}
    ports:
      - "127.0.0.1:${PROFILE_DB_PORT:-5434}:5432"
    volumes:
      - profiles-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_service -d movie_rec_hub_profiles"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  profiles-db-data:

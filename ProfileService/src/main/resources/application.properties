spring.application.name=profile-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${PROFILE_DB_URL:jdbc:postgresql://localhost:5434/movie_rec_hub_profiles}
spring.datasource.username=${PROFILE_DB_USERNAME:profile_service}
spring.datasource.password=${PROFILE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

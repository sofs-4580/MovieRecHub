spring.application.name=profile-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${PROFILE_DB_URL:jdbc:postgresql://localhost:5434/movie_rec_hub_profiles}
spring.datasource.username=${PROFILE_DB_USERNAME:profile_service}
spring.datasource.password=${PROFILE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Same-origin proxy forwards the UserService session cookie to this service.
user.service.base-url=${USER_SERVICE_URL:http://localhost:8081}
user.service.connect-timeout=${USER_CONNECT_TIMEOUT:2s}
user.service.read-timeout=${USER_READ_TIMEOUT:3s}


# Retry username backfill for profiles created before username delivery was introduced.
profile.username-backfill.enabled=${PROFILE_USERNAME_BACKFILL_ENABLED:true}
profile.username-backfill.poll-delay=${PROFILE_USERNAME_BACKFILL_POLL_DELAY:30000}
profile.username-backfill.batch-size=${PROFILE_USERNAME_BACKFILL_BATCH_SIZE:20}

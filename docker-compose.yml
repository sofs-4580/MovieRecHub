version: "3.8"

services:

  # ---- movie-service --------------------------------------------------------------
  movie-service:
    build:
      context: .
      dockerfile: MovieService/Dockerfile
    container_name: movie-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - pgserver-movie
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgserver-movie:5432/moviedb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SERVER_PORT=8082
      - TMDB_API_KEY=${TMDB_API_KEY} #movies db API Key
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:8083
    networks:
      - psianet

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - psianet

  recommendation-service:
    build:
      context: .
      dockerfile: RecomendationService/Dockerfile
    container_name: recommendation-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      - movie-service
      - ollama
    environment:
      - SERVER_PORT=8083
      - MOVIE_SERVICE_URL=http://movie-service:8082
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
    networks:
      - psianet

  pgserver-movie:
    image: postgres:15.1-alpine
    container_name: pgserver-movie
    volumes:
      - postgres-movie-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=moviedb
    restart: unless-stopped
    networks:
      - psianet

  # ---- user-service ----------------------------------------------------------------
  # Descomentar quando o UserService/Dockerfile existir e o serviço buildar.


  # ---- profile-service -------------------------------------------------------


volumes:
  postgres-movie-data:
  ollama-data:
  # postgres-user-data:
  # postgres-recommendation-data:

networks:
  psianet:
    driver: bridge

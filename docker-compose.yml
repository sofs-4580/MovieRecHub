name: movie-rec-hub

# Default ports (container == host port)
#   frontend 8080 | user-service 8081 | profile-service 8082
#   movie-service 8083 | recommendation-service 8084
#   DBs on the host: users 5433 | profiles 5434 | movies 5435 | recommendations 5436

services:
  # ---------------------------------------------------------------- databases
  users-db:
    extends:
      file: ./UserService/compose.yaml
      service: users-db
    restart: unless-stopped

  profiles-db:
    extends:
      file: ./ProfileService/compose.yaml
      service: profiles-db
    restart: unless-stopped

  movie-db:
    extends:
      file: ./MovieService/compose.yaml
      service: movie-db
    restart: unless-stopped

  reco-db:
    extends:
      file: ./RecomendationService/compose.yaml
      service: reco-db
    restart: unless-stopped

  # ----------------------------------------------------------------- services
  user-service:
    build:
      context: ./UserService
    environment:
      DB_URL: jdbc:postgresql://users-db:5432/movie_rec_hub_users
      DB_USERNAME: user_service
      DB_PASSWORD: ""
      PROFILE_SERVICE_URL: http://profile-service:8082
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      users-db:
        condition: service_healthy
    restart: unless-stopped

  profile-service:
    build:
      context: ./ProfileService
    environment:
      DB_URL: jdbc:postgresql://profiles-db:5432/movie_rec_hub_profiles
      DB_USERNAME: profile_service
      DB_PASSWORD: ""
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "127.0.0.1:${PROFILE_SERVICE_PORT:-8082}:8082"
    depends_on:
      profiles-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
    restart: unless-stopped

  movie-service:
    build:
      context: ./MovieService
    environment:
      DB_URL: jdbc:postgresql://movie-db:5432/movie_rec_hub_movies
      DB_USERNAME: movie_service
      DB_PASSWORD: ""
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    ports:
      - "127.0.0.1:${MOVIE_SERVICE_PORT:-8083}:8083"
    depends_on:
      movie-db:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------- recommendation service
  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # first run: docker compose exec ollama ollama pull hf.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M

  recommendation-service:
    build:
      context: ./RecomendationService
    environment:
      DB_URL: jdbc:postgresql://reco-db:5432/movie_rec_hub_recommendations
      DB_USERNAME: reco_service
      DB_PASSWORD: ""
      MOVIE_SERVICE_URL: http://movie-service:8083
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
    ports:
      - "127.0.0.1:${RECOMMENDATION_SERVICE_PORT:-8084}:8084"
    depends_on:
      reco-db:
        condition: service_healthy
      movie-service:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------- frontend
  frontend:
    build:
      context: ./Frontend
    environment:
      USER_SERVICE_URL: http://user-service:8081
      PROFILE_SERVICE_URL: http://profile-service:8082
      MOVIE_SERVICE_URL: http://movie-service:8083
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      user-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      movie-service:
        condition: service_healthy
    restart: unless-stopped
  # --------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  users-db-data:
  profiles-db-data:
  movie-db-data:
  reco-db-data:
  ollama-data:
  prometheus-data:
  grafana-data:

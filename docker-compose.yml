version: "3.8"

services:

  # ---- movie-service --------------------------------------------------------------
  movie-service:
    build:
      context: .
      dockerfile: MovieService/Dockerfile
    container_name: movie-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - pgserver-movie
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgserver-movie:5432/moviedb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SERVER_PORT=8082
      - TMDB_API_KEY=${TMDB_API_KEY} #movies db API Key
    networks:
      - psianet

  pgserver-movie:
    image: postgres:15.1-alpine
    container_name: pgserver-movie
    volumes:
      - postgres-movie-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=moviedb
    restart: unless-stopped
    networks:
      - psianet

  # ---- frontend (paginas Thymeleaf; fala com os microservicos pela API REST) -----
  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - movie-service
    environment:
      - SERVER_PORT=8080
      - MOVIE_SERVICE_URL=http://movie-service:8082
    networks:
      - psianet

  # ---- user-service ----------------------------------------------------------------
  # Descomentar quando o UserService/Dockerfile existir e o serviço buildar.


  # ---- profile-service -------------------------------------------------------


volumes:
  postgres-movie-data:
  # postgres-user-data:
  # postgres-recommendation-data:

networks:
  psianet:
    driver: bridge

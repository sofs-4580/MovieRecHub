---
- name: Remove the temporary Nginx test
  hosts: control_plane
  become: true
  gather_facts: false
  any_errors_fatal: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Require normal execution for cleanup
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: "Use --syntax-check locally or run normally against the real cluster."
    - name: Verify that the control plane has been installed
      ansible.builtin.include_tasks: tasks/check-cluster.yml
    - name: Copy the manifest so cleanup also works from a new management container
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/smoke-test/deployment.yaml"
        dest: /home/ubuntu/nginx-smoke-test.yaml
        mode: "0644"
    - name: Remove the test namespace, Deployment and Service
      ansible.builtin.command: kubectl delete -f /home/ubuntu/nginx-smoke-test.yaml --ignore-not-found=true --wait=true --timeout=180s
      register: nginx_delete
      changed_when: "' deleted' in nginx_delete.stdout"
    - name: Remove the temporary manifest from the control plane
      ansible.builtin.file:
        path: /home/ubuntu/nginx-smoke-test.yaml
        state: absent

---
- name: Create the local kubeconfig directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
- name: Copy the administrator kubeconfig to the management container
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: true
  no_log: true
- name: Reach the public API while verifying its stable private certificate identity
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ lookup('env', 'HOME') }}/.kube/config"
      - config
      - set-cluster
      - psia-g34
      - "--server=https://{{ hostvars[inventory_hostname].ansible_host }}:6443"
      - "--tls-server-name={{ hostvars[inventory_hostname].kubernetes_node_ip }}"
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: true
- name: Protect the local administrative credentials
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: "0600"
  delegate_to: localhost
  become: false

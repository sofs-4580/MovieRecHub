---
- name: Validate the registry inventory and supported node architecture
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture == 'x86_64'
      - gcp_project_id is defined
      - registry_image_prefix == 'europe-west4-docker.pkg.dev/' ~ gcp_project_id ~ '/psia-g34'
      - registry_service_account == 'psia-g34-nodes@' ~ gcp_project_id ~ '.iam.gserviceaccount.com'
    fail_msg: "Use the updated Terraform inventory and the shared amd64 VMs. Apply registry then gcp Terraform before configuring the nodes."
- name: Read the VM identity without requesting a token
  ansible.builtin.uri:
    url: http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/email
    headers:
      Metadata-Flavor: Google
    return_content: true
    use_proxy: false
    timeout: 10
  register: node_identity
  retries: 6
  delay: 5
  until: node_identity.status | default(0) == 200
- name: Require the Terraform service account on this VM
  ansible.builtin.assert:
    that: node_identity.content | trim == registry_service_account
    fail_msg: "VM identity differs. Apply the reviewed Terraform plan and regenerate its inventory; copying a credential file is not a substitute."
- name: Create credential provider directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: ["{{ credential_provider_bin_dir }}", /etc/kubernetes]
- name: Download and verify the official GCP credential provider
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/gke-release/auth-provider-gcp/{{ gcp_credential_provider_version }}/linux_amd64/auth-provider-gcp"
    dest: "{{ credential_provider_bin_dir }}/auth-provider-gcp"
    checksum: "sha512:{{ gcp_credential_provider_sha512 }}"
    owner: root
    group: root
    mode: "0755"
    timeout: 60
  notify: Restart kubelet
- name: Configure image credentials only for this repository
  ansible.builtin.template:
    src: templates/image-credentials.yaml.j2
    dest: "{{ credential_provider_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart kubelet
- name: Set the private IP and credential provider flags together
  ansible.builtin.template:
    src: templates/kubelet-default.j2
    dest: /etc/default/kubelet
    owner: root
    group: root
    mode: "0644"
  notify: Restart kubelet

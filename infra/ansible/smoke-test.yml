---
- name: Deploy Nginx and verify the public HTTP path
  hosts: control_plane
  become: true
  gather_facts: false
  any_errors_fatal: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Check prerequisites for the real cluster test
      ansible.builtin.assert:
        that:
          - groups.get('control_plane', []) | length == 1
          - groups.get('workers', []) | length >= 1
          - not ansible_check_mode
        fail_msg: "Run after cluster.yml with the Terraform inventory. Use --syntax-check for local validation."
    - name: Verify that the control plane has been installed
      ansible.builtin.include_tasks: tasks/check-cluster.yml
    - name: Copy the versioned Nginx manifest to the control plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/smoke-test/deployment.yaml"
        dest: /home/ubuntu/nginx-smoke-test.yaml
        mode: "0644"
    - name: Apply the Nginx namespace, Deployment and Service
      ansible.builtin.command: kubectl apply -f /home/ubuntu/nginx-smoke-test.yaml
      register: nginx_apply
      changed_when: "' created' in nginx_apply.stdout or ' configured' in nginx_apply.stdout"
    - name: Wait for the Nginx Deployment to become available
      ansible.builtin.command: kubectl -n nginx-smoke-test rollout status deployment/nginx --timeout=180s
      changed_when: false
    - name: Check Nginx through each worker public IP from the management container
      ansible.builtin.uri:
        url: "http://{{ hostvars[item].ansible_host }}:30510/"
        status_code: 200
        return_content: true
        timeout: 10
        use_proxy: false
      delegate_to: localhost
      become: false
      loop: "{{ groups['workers'] }}"
      register: nginx_http
      until: >-
        nginx_http.status | default(0) == 200 and
        'Welcome to nginx!' in (nginx_http.content | default(''))
      retries: 12
      delay: 5
    - name: Show the test URLs to open in the browser
      ansible.builtin.debug:
        msg: "Nginx test passed: http://{{ hostvars[item].ansible_host }}:30510/"
      loop: "{{ groups['workers'] }}"

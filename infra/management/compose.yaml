name: g34-management-${GCP_PROJECT_ID:?Define GCP_PROJECT_ID no ficheiro local .env}
services:
  management:
    image: g34-management:local-${MANAGEMENT_UID:-1000}-${MANAGEMENT_GID:-1000}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MANAGEMENT_UID: ${MANAGEMENT_UID:-1000}
        MANAGEMENT_GID: ${MANAGEMENT_GID:-1000}
    init: true
    stdin_open: true
    tty: true
    environment:
      CLOUDSDK_CORE_PROJECT: ${GCP_PROJECT_ID:?Define GCP_PROJECT_ID no ficheiro local .env}
      CLOUDSDK_CONFIG: /home/cloudsdk/.config/gcloud
    volumes:
      # Relative bind paths are resolved from this Compose file's directory.
      - type: bind
        source: ../..
        target: /workspace
      # The helper creates this private directory before starting the container.
      - type: bind
        source: ./.local/gcloud
        target: /home/cloudsdk/.config/gcloud
        bind:
          create_host_path: false
      - type: volume
        source: kube-config
        target: /home/cloudsdk/.kube
      - type: volume
        source: ssh-config
        target: /home/cloudsdk/.ssh

volumes:
  kube-config:
  ssh-config:

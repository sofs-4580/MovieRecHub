# https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  # How frequently to scrape targets by default.
  scrape_interval: 15s

  # How long until a scrape request times out.
  # It cannot be greater than the scrape interval.
  scrape_timeout: 10s

  # How frequently to evaluate rules.
  evaluation_interval: 15s

  # The labels to add to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  # Environment variable references `${var}` or `$var` are replaced according
  # to the values of the current environment variables.
  # References to undefined variables are replaced by the empty string.
  # The `$` character can be escaped by using `$$`.
  external_labels:
    project: movie-rec-hub
    environment: gcp

# Rule files specifies a list of globs. Rules and alerts are read from
# all matching files.
rule_files: [] #todo

# A list of scrape configurations.
scrape_configs:
  # Spring Boot services: Pods in movie-rec-hub with a container port named "http"
  # (the databases name their port "postgres"). Same job name and "service" label
  # as prometheus.yml, so the services dashboard works in both environments.

  # The job name assigned to scraped metrics by default.
  - job_name: spring-services

    # The HTTP resource path on which to fetch metrics from targets.
    metrics_path: /actuator/prometheus

    # List of Kubernetes service discovery configurations.
    kubernetes_sd_configs:
      # The Kubernetes role of entities that should be discovered.
      # One of endpoints, endpointslice, service, pod, node, or ingress.
      - role: pod
        # Optional namespace discovery. If omitted, all namespaces are used.
        namespaces:
          names: [movie-rec-hub]

    # List of target relabel configurations.
    relabel_configs:
      # The source_labels tells the rule what labels to fetch from the series. Any
      # labels which do not exist get a blank value ("").  Their content is concatenated
      # using the configured separator and matched against the configured regular expression
      # for the replace, keep, and drop actions.
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        # Action to perform based on regex matching.
        # keep: Drop targets for which regex does not match the concatenated source_labels.
        action: keep
        # Regular expression against which the extracted value is matched.
        regex: http
      - source_labels: [__meta_kubernetes_pod_phase]
        action: keep
        regex: Running
      - source_labels: [__meta_kubernetes_pod_label_app]
        # Label to which the resulting value is written in a replace action.
        # It is mandatory for replace actions. Regex capture groups are available.
        target_label: service
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - target_label: cluster
        # Replacement value against which a regex replace is performed if the
        # regular expression matches. Regex capture groups are available.
        replacement: movie-rec-hub

  # CPU, RAM, disk and network of every VM (one node-exporter Pod per node).
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: node-exporter
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance
      - target_label: cluster
        replacement: movie-rec-hub

  # State of Kubernetes objects: Pods ready, restarts, requests and limits.
  - job_name: kube-state-metrics

    # honor_labels controls how Prometheus handles conflicts between labels that are
    # already present in scraped data and labels that Prometheus would attach
    # server-side ("job" and "instance" labels, manually configured target
    # labels, and labels generated by service discovery implementations).
    #
    # If honor_labels is set to "true", label conflicts are resolved by keeping label
    # values from the scraped data and ignoring the conflicting server-side labels.
    honor_labels: true

    # List of labeled statically configured targets for this job.
    static_configs:
      # The targets specified by the static config.
      - targets: [kube-state-metrics.monitoring.svc:8080]
    relabel_configs:
      - target_label: cluster
        replacement: movie-rec-hub

  # CPU and memory of every container, read from the kubelet's cAdvisor
  # through the API server.
  - job_name: cadvisor

    # Configures the protocol scheme used for requests.
    scheme: https

    # Sets the `Authorization` header on every request with
    # the configured credentials.
    authorization:
      # Sets the credentials of the request with the credentials read from the
      # configured file. It is mutually exclusive with `credentials`.
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

    # Configures the request's TLS settings.
    tls_config:
      # CA certificate to validate API server certificate with. At most one of ca and ca_file is allowed.
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    kubernetes_sd_configs:
      # The node role discovers one target per cluster node.
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        regex: (.+)
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_node_name]
        target_label: instance
      - target_label: cluster
        replacement: movie-rec-hub

  # Prometheus's own metrics.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
    relabel_configs:
      - target_label: cluster
        replacement: movie-rec-hub